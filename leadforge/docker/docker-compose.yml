version: "3.8"

services:
  # ============================================
  # n8n — Workflow Engine
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - HERMES_API_URL=${HERMES_API_URL}
      - HERMES_API_KEY=${HERMES_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/data/workflows
    depends_on:
      - redis
    restart: unless-stopped

  # ============================================
  # n8n Worker — Background Processing
  # ============================================
  n8n-worker:
    image: n8nio/n8n:latest
    command: worker
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - HERMES_API_URL=${HERMES_API_URL}
      - HERMES_API_KEY=${HERMES_API_KEY}
    depends_on:
      - redis
      - n8n
    restart: unless-stopped

  # ============================================
  # Redis — Queue / Cache
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ============================================
  # Hermes — AI Agent Layer
  # ============================================
  hermes:
    image: nousresearch/hermes-agent:latest
    ports:
      - "8642:8642"
    env_file:
      - .env
    volumes:
      - hermes_data:/app/data
    restart: unless-stopped

  # ============================================
  # Backend API — Custom API for n8n ↔ Hermes
  # ============================================
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - HERMES_API_URL=${HERMES_API_URL}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # ============================================
  # Website Builder — AI Website Generation
  # ============================================
  website-builder:
    build:
      context: ./website-builder
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - HERMES_API_URL=${HERMES_API_URL}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
    volumes:
      - website_output:/output
    restart: unless-stopped

  # ============================================
  # Dashboard — Next.js Web UI
  # ============================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend-api
    restart: unless-stopped

  # ============================================
  # Nginx — Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - n8n
      - dashboard
      - backend-api
    restart: unless-stopped

volumes:
  n8n_data:
  redis_data:
  hermes_data:
  website_output: